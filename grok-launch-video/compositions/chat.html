      const tl = gsap.timeline({ paused: true })

      const stage = window.Mascot.create({ canvas: document.getElementById("chat-mascot"), width: 1280, height: 720 })
      const bot = stage.add({ palette: "dark" })

      // phase A bubble bounds measured per frame (unmirrored): frame, left, top, right, bottom
      const BUBBLE = [
        [295, 683, 620, 683, 620], [296, 672, 604, 694, 620], [298, 674, 537, 816, 631],
        [300, 675, 480, 888, 596], [302, 673, 452, 882, 572], [304, 674, 443, 882, 563],
        [306, 677, 443, 886, 563], [308, 678, 443, 889, 563], [310, 678, 441, 891, 561],
        [312, 678, 436, 890, 556], [314, 678, 431, 888, 549], [316, 676, 426, 884, 543],
        [318, 673, 421, 885, 538], [320, 668, 418, 890, 531], [322, 657, 417, 896, 521],
        [324, 644, 409, 920, 506], [326, 640, 405, 928, 501],
      ]
      // phase B message bubble width, card and reply bounds, per frame
      const MSG_W = [[326, 257], [329, 333], [332, 369], [335, 390], [337, 407]]
      const REPLY_W = 1.204 // the reply is longer than the source's, so its measured widths are scaled
      const REPLY_L = [[349, 1098], [350, 987], [353, 980], [356, 977], [359, 975], [362, 975], [365, 895], [368, 787], [371, 749], [374, 732], [377, 726]].map(([f, l]) => [f, 1099 - (1099 - l) * REPLY_W])

      const bubble = document.getElementById("chat-bubble")
      const bubbleIn = document.getElementById("chat-bubble-in")
      const msg = document.getElementById("chat-msg")
      const chat = document.getElementById("chat-chat")
      const reply = document.getElementById("chat-reply")

      function draw(t) {
        const frame = time.frameAt(t)
        const A = frame < CUT
        document.getElementById("chat-a").style.visibility = A ? "visible" : "hidden"
        document.getElementById("chat-b").style.visibility = A ? "hidden" : "visible"
        const s = trackPose(A ? "text1" : "text2", frame)
        // phase A is mirrored from the source: the bot stands on the right, its bubble on the left
        if (A) Object.assign(s, { x: 1280 - s.x, yaw: -s.yaw, roll: -s.roll })
        bot.pose({ ...s, accessory: true })
        stage.render()
        if (A) {
          const [, l0, tp, r0, b] = keyframes(BUBBLE, frame)
          const [l, r] = [1280 - r0, 1280 - l0]
          const h = Math.max(b - tp, 1)
          const sc = h / 120
          bubble.style.transform = `translate(${l}px, ${tp}px) scale(${sc})`
          bubble.style.width = `${(r - l) / sc}px`
          bubble.style.opacity = frame < 295.5 ? 0 : 1
        } else {
          // the chat scrolls with the character (laid out for frame 380, character y 157)
          chat.style.transform = `translateY(${s.y - 157}px)`
          msg.style.width = `${keyframes(MSG_W, frame)[1]}px`
          const left = keyframes(REPLY_L, frame)[1]
          reply.style.left = `${left}px`
          reply.style.width = `${1099 - left}px`
          reply.style.opacity = frame >= 349.5 ? 1 : 0
        }
      }

      // title words
      popWord(tl, "#chat-text", lt(293))
      popWord(tl, "#chat-your", lt(296))
      popWord(tl, "#chat-customers", lt(298))
      tl.fromTo(".chat-word", { yPercent: 0 }, { yPercent: -6, duration: lt(326) - 0.35, ease: "none", immediateRender: false }, 0.35)

      // typing dots bounce, then vanish one by one, then "On", "On it!"
      document.querySelectorAll(".chat-dot").forEach((d, k) => {
        tl.fromTo(d, { y: 0 }, { y: -6, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 3 }, lt(300) + k * 0.08)
        tl.set(d, { opacity: 0 }, lt(314 - k * 3))
      })
      tl.set("#chat-hi", { opacity: 1 }, lt(319.5))
      tl.set("#chat-hi2", { opacity: 0 }, 0)
      tl.set("#chat-hi2", { opacity: 1 }, lt(323))

      // chat: words of the first message, card, reply typing then text
      document.querySelectorAll("#chat-msg span").forEach((w, k) => {
        tl.set(w, { opacity: 1 }, lt([326, 328, 332, 334, 336][k]))
      })
      tl.fromTo("#chat-card", { opacity: 0 }, { opacity: 1, duration: 0.33, ease: "power1.in" }, lt(334))
      tl.fromTo("#chat-reply-dots", { opacity: 1 }, { opacity: 0, duration: 0.05 }, lt(363))
      tl.fromTo("#chat-reply-text", { opacity: 0 }, { opacity: 1, duration: 0.05 }, lt(363))

      // out: the chat and its bot slide off to the left, the next chat comes in from the right
      window.Kit.slideOut(tl, ["#chat-b", "#chat-mascot"], time.duration, { x: -300 })

      everyFrame(tl, time.duration, draw)
      window.__timelines["chat"] = tl
    })()
