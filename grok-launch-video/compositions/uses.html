  <script>
    (function () {
      const { BEAT, everyFrame, random, slideOut } = window.Kit
      const DURATION = 16 * BEAT
      const tl = gsap.timeline({ paused: true })
      const $ = (id) => document.getElementById(id)
      window.AppIcons.fill($("root"))

      // The grid grows: each tile slides in from the side the grid grows to, and the camera
      // pulls back to frame every tile shown so far.
      const TILES = {
        t1: { x: 60, y: 60, w: 600, h: 470, at: 0, from: { y: 90 } },
        t2: { x: 684, y: 60, w: 576, h: 470, at: 3 * BEAT, from: { x: 160 } },
        t3: { x: 1284, y: 60, w: 576, h: 470, at: 5.5 * BEAT, from: { x: 160 } },
        t4: { x: 60, y: 554, w: 880, h: 466, at: 8 * BEAT, from: { y: 160 } },
        t5: { x: 964, y: 554, w: 896, h: 466, at: 10 * BEAT, from: { y: 160 } },
      }
      const FRAME_FILL = 0.86
      const MAX_ZOOM = 1.75
      const CAM_MOVE_S = 0.95
      const PUSH_PER_S = 0.004
      const DRIFT_X_PER_S = 3
      const DRIFT_Y_PER_S = 1.5
      const CAM_LEAD_S = 0.12 // the camera starts moving just before the tile lands
      function framing(ids) {
        const x0 = Math.min(...ids.map((k) => TILES[k].x))
        const y0 = Math.min(...ids.map((k) => TILES[k].y))
        const x1 = Math.max(...ids.map((k) => TILES[k].x + TILES[k].w))
        const y1 = Math.max(...ids.map((k) => TILES[k].y + TILES[k].h))
        const s = Math.min((1920 * FRAME_FILL) / (x1 - x0), (1080 * FRAME_FILL) / (y1 - y0), MAX_ZOOM)
        return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, s }
      }
      const SHOTS = [
        { at: 0, ...framing(["t1"]) },
        { at: TILES.t2.at - CAM_LEAD_S, ...framing(["t1", "t2"]) },
        { at: TILES.t3.at - CAM_LEAD_S, ...framing(["t1", "t2", "t3"]) },
        { at: TILES.t4.at - CAM_LEAD_S, ...framing(["t1", "t2", "t3", "t4", "t5"]) },
      ]
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2)
      function camAt(t) {
        let c = { ...SHOTS[0] }
        for (const shot of SHOTS.slice(1)) {
          const p = easeInOut(Math.min(1, Math.max(0, (t - shot.at) / CAM_MOVE_S)))
          c = { cx: c.cx + (shot.cx - c.cx) * p, cy: c.cy + (shot.cy - c.cy) * p, s: c.s + (shot.s - c.s) * p }
        }
        // never still: a slow push in and drift on top of the framing
        const s = c.s * (1 + PUSH_PER_S * t)
        return { s, tx: 960 - s * (c.cx - DRIFT_X_PER_S * t), ty: 540 - s * (c.cy - DRIFT_Y_PER_S * t) }
      }

      for (const [id, tile] of Object.entries(TILES)) {
        const el = $(`uses-${id}`)
        tl.fromTo(el, { ...tile.from, scale: 0.92, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.8, ease: "expo.out" }, tile.at)
      }

      // 1: the number types in, then the SMS code arrives
      const NUMBER = "+1 415 555 0142"
      const t1 = TILES.t1.at
      tl.fromTo("#uses-sms", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, t1 + 0.95)

      // 2: the four sign-ups get a check one after another
      document.querySelectorAll("#uses-t2 .uses-acct").forEach((el, k) => {
        tl.fromTo(el, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, TILES.t2.at + 0.15 + k * 0.07)
      })
      document.querySelectorAll("#uses-t2 .uses-check").forEach((el, k) => {
        tl.fromTo(el, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.4)" }, TILES.t2.at + 0.55 + k * 0.16)
      })

      // 3: upvote turns orange and the count climbs, then a comment is posted
      const t3 = TILES.t3.at
      const UPVOTE_AT = t3 + 0.5
      tl.to("#uses-arrow", { fill: "#ff4500", stroke: "#ff4500", duration: 0.15 }, UPVOTE_AT)
      tl.fromTo("#uses-votes", { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, UPVOTE_AT)
      tl.fromTo("#uses-comment", { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, t3 + 1.1)

      // 4: a feed of videos scrolls by, hearts fly up from each liked one
      const t4 = TILES.t4.at
      const feed = $("uses-feed")
      const VIDEO_COLORS = [["#fe2c55", "#7b2ff7"], ["#25f4ee", "#1d4ed8"], ["#f59e0b", "#ef4444"], ["#10b981", "#0ea5e9"], ["#a855f7", "#ec4899"], ["#f97316", "#facc15"], ["#06b6d4", "#6366f1"], ["#84cc16", "#14b8a6"], ["#ec4899", "#f43f5e"], ["#3b82f6", "#22d3ee"]]
      const VIDEO_STEP = 170
      VIDEO_COLORS.forEach(([a, b], k) => {
        const v = document.createElement("div")
        v.className = "uses-video"
        v.style.left = `${40 + k * VIDEO_STEP}px`
        v.style.background = `linear-gradient(160deg, ${a}, ${b})`
        v.innerHTML = "<i></i>"
        feed.appendChild(v)
      })
      const rand = random(11)
      const HEART_EVERY_S = 0.3
      const HEART_RISE_S = 1.1
      const hearts = Array.from({ length: 14 }, (_, k) => {
        const el = document.createElement("div")
        el.className = "uses-heart"
        el.innerHTML = '<svg viewBox="0 0 24 24" width="54" height="54"><path fill="#fe2c55" d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 3 4.5 6.6 4.5c2.1 0 3.8 1.2 5.4 3.1 1.6-1.9 3.3-3.1 5.4-3.1 3.6 0 5.8 3.7 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>'
        $("uses-hearts").appendChild(el)
        return { el, at: t4 + 0.45 + k * HEART_EVERY_S, x: 120 + rand() * 600, sway: (rand() - 0.5) * 60 }
      })
      const LIKES_BASE = 23

      // 5: three taps on the app under test, each test row turns green
      const t5 = TILES.t5.at
      const TAPS = [[72, 135], [72, 179], [72, 232]]
      document.querySelectorAll("#uses-t5 .uses-test").forEach((el, k) => {
        tl.fromTo(el, { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, t5 + 0.12 + k * 0.08)
        tl.fromTo(el.querySelector(".uses-check"), { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, t5 + 0.6 + k * 0.38)
      })
      const ripple = $("uses-ripple")

      const cam = $("uses-cam")
      function draw(t) {
        const c = camAt(t)
        cam.style.transform = `translate(${c.tx}px, ${c.ty}px) scale(${c.s})`

        const typed = Math.floor(Math.max(0, Math.min(1, (t - t1 - 0.25) / 0.55)) * NUMBER.length)
        $("uses-digits").textContent = NUMBER.slice(0, typed)

        const up = Math.max(0, Math.min(1, (t - UPVOTE_AT) / 1.2))
        const votes = Math.round(12 + (1248 - 12) * (1 - Math.pow(1 - up, 3)))
        $("uses-count").textContent = votes.toLocaleString("en-US")

        feed.style.transform = `translateX(${-Math.max(0, t - t4) * 120}px)`
        let liked = 0
        for (const h of hearts) {
          const p = (t - h.at) / HEART_RISE_S
          if (p >= 0) liked++
          const visible = p >= 0 && p <= 1
          h.el.style.opacity = visible ? String(Math.min(1, p * 6) * (1 - Math.max(0, p - 0.6) / 0.4)) : "0"
          if (!visible) continue
          const pop = p < 0.15 ? 0.5 + (p / 0.15) * 0.7 : 1.2 - Math.min(0.2, (p - 0.15) * 0.6)
          h.el.style.transform = `translate(${h.x + Math.sin(p * 3) * h.sway}px, ${250 - p * 200}px) scale(${pop})`
        }
        $("uses-likes").textContent = String(LIKES_BASE + liked)

        // tap ripple: the latest tap grows and fades
        const k = TAPS.findLastIndex((_, i) => t >= t5 + 0.45 + i * 0.38)
        const rp = k < 0 ? 1 : (t - (t5 + 0.45 + k * 0.38)) / 0.35
        ripple.style.opacity = rp < 1 ? String(1 - rp) : "0"
        if (k >= 0) {
          ripple.style.left = `${TAPS[k][0]}px`
          ripple.style.top = `${TAPS[k][1]}px`
          ripple.style.transform = `scale(${0.3 + rp * 0.9})`
        }
      }

      // out: the tiles lift away row by row, the background darkens into the outro
      slideOut(tl, ["#uses-t4", "#uses-t5"], DURATION - 0.06, { y: -140 })
      slideOut(tl, ["#uses-t1", "#uses-t2", "#uses-t3"], DURATION, { y: -140 })
      tl.fromTo("#root", { backgroundColor: "#111113" }, { backgroundColor: "#07061a", duration: 1.2, ease: "power1.inOut" }, DURATION - 1.2)

      everyFrame(tl, DURATION, draw)
      window.__timelines["uses"] = tl
    })()
  </script>
</template>
