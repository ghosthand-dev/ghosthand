  <script>
    (function () {
      const { FPS, keyframes, trackPose, popWord, everyFrame, stretchTo } = window.Kit
      const F0 = 189 // first source frame of this scene (6.3 s)
      // held while the phone is down and "Taps, scrolls, types" is read
      const time = stretchTo(F0, 292, 8, [[275, 282, 1]])
      const lt = time.lt
      const tl = gsap.timeline({ paused: true })
      window.AppIcons.fill(document.getElementById("apps-screen"))
      const stage = window.Mascot.create({ canvas: document.getElementById("apps-mascot"), width: 1280, height: 720 })
      const bot = stage.add({ palette: "dark" })
      const pointer = stage.add({ palette: "light", accessory: null })

      // screen top y of the phone per source frame, starting at F0
      const PHONE_TOP = [740, 672, 624, 590, 565, 547, 534, 524, 515, 509, 504, 500, 498, 495, 493, 491, 489, 487, 484, 482, 480, 478, 475, 471, 467, 462, 456, 448, 437, 422, 400, 364, 317, 273, 229, 243, 240, 236, 229, 220, 210, 199, 189, 180, 173, 169, 167, 165.5, 164.5, 163.5, 162, 160, 159, 158, 156, 155, 154, 153, 151, 150, 149, 148, 149, 152, 155, 159, 166, 174, 186, 202, 226, 258, 291, 317, 336, 351, 362, 371, 378, 383, 388, 392, 395, 397, 399, 401, 402, 403, 403, 403, 403, 403, 402, 400, 399, 396, 394, 390, 385, 379, 372, 362, 349].map((v, i) => [F0 + i, v])
      const SCREEN_X = 212 // screen left edge in stage px
      const PT = 854 / 375 // stage px per iPhone point in the recording

      // the bot jumps from above the phone down onto the TikTok icon: frame, x, y, R, yaw, pitch, roll
      const JUMP = [
        [216, 642.4, 191.2, 87.4, 0.36, -0.48, 0.04], [217, 615, 186, 85, 0.42, -0.45, 0.03],
        [218, 589, 183, 83, 0.47, -0.42, 0.03], [219, 556, 196, 79, 0.51, -0.38, 0.02],
        [220, 520, 214, 72, 0.5, -0.36, 0], [221, 470, 262, 62, 0.48, -0.33, -0.03],
        [222, 420, 330, 50, 0.46, -0.31, -0.05], [223, 372, 410, 40, 0.45, -0.29, -0.07],
      ]
      const JUMP_START = 216
      const IN_PHONE = 224 // the white pointer takes over inside the screen
      // pointer in screen coordinates: frame, x, y below the screen top, R, yaw, pitch, roll
      const POINTER = [
        [224, 352, 232, 34, 0.45, -0.25, -0.08], [226, 342, 254, 30, 0.42, -0.1, -0.12], [228, 340, 262, 29, 0.38, 0, -0.14],
        [232, 340, 262, 29, 0.36, 0.02, -0.14], [233.5, 340, 264, 24, 0.36, 0.08, -0.14], [236, 340, 262, 29, 0.36, 0, -0.14],
        // TikTok opens, the pointer glides to an empty spot next to the caption the agent is typing
        [240, 340, 262, 29, 0.36, 0, -0.14], [248, SCREEN_X + 200 * PT, 118 + (175 - 20) * PT, 27, 0.1, 0.12, -0.05],
        [292, SCREEN_X + 200 * PT, 118 + (175 - 20) * PT, 27, 0.1, 0.12, -0.05],
      ]
      const TAP = 233
      const APP_OPEN = 236

      const phone = document.getElementById("apps-iphone")
      const ring = document.getElementById("apps-ring")
      const ripple = document.getElementById("apps-ripple")
      const phoneTop = (frame) => keyframes(PHONE_TOP, frame)[1]

      function draw(t) {
        const frame = time.frameAt(t)
        const top = phoneTop(frame)
        phone.style.transform = `translateY(${top - 43}px)`

        if (frame < JUMP_START) {
          bot.pose({ ...trackPose("phone", frame), accessory: true })
        } else if (frame < IN_PHONE) {
          const [, x, y, R, yaw, pitch, roll] = keyframes(JUMP, frame)
          bot.pose({ x, y, R, yaw, pitch, roll, accessory: true })
        } else {
          bot.pose({ hidden: true })
        }

        if (frame < IN_PHONE) {
          pointer.pose({ hidden: true })
          ring.style.opacity = 0
        } else {
          const [, x, dy, R, yaw, pitch, roll] = keyframes(POINTER, frame)
          const y = top + dy
          pointer.pose({ x, y, R, yaw, pitch, roll, blink: 1 })
          const grow = Math.min(1, (frame - IN_PHONE) / 3)
          ring.style.transform = `translate(${x}px, ${y}px) scale(${(R * 1.5 * grow) / 50})`
          ring.style.opacity = grow
        }

        const k = Math.max(0, (frame - TAP) / 10)
        ripple.style.opacity = frame >= TAP && k < 1 ? 1 - k : 0
        ripple.style.transform = `translate(340px, ${top + 262}px) scale(${0.4 + k * 1.2})`
        stage.render()
      }

      // the TikTok icon presses in, then the app zooms open from it
      tl.fromTo("#apps-tiktok", { scale: 1 }, { scale: 0.86, duration: 0.08, ease: "power2.out", immediateRender: false }, lt(TAP))
      tl.to("#apps-tiktok", { scale: 1, duration: 0.15, ease: "power2.out" }, lt(TAP + 2.4))
      tl.fromTo(
        "#apps-app",
        { opacity: 0, scale: 0.16, borderRadius: 190 },
        { opacity: 1, scale: 1, borderRadius: 0, duration: 0.32, ease: "power3.out", immediateRender: false },
        lt(APP_OPEN),
      )

      tl.set("#apps-home-status", { opacity: 0 }, lt(APP_OPEN + 8)) // covered by the open app

      // "Taps, scrolls, types"
      popWord(tl, "#apps-taps", lt(261), { dy: 11, duration: 0.3 })
      popWord(tl, "#apps-scrolls", lt(264), { dy: 11, duration: 0.3 })
      popWord(tl, "#apps-types", lt(267), { dy: 11, duration: 0.3 })
      tl.fromTo("#apps-title", { y: 0 }, { y: -13, duration: 0.4, ease: "power2.in" }, lt(280))

      everyFrame(tl, time.duration, draw)
      window.__timelines["apps"] = tl
    })()
  </script>
