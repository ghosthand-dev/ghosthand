  <script>
    (function () {
      const { BEAT, everyFrame } = window.Kit
      const DURATION = 15 * BEAT
      const tl = gsap.timeline({ paused: true })
      window.AppIcons.fill(document.getElementById("demo-chat"))
      const avatarStage = window.Mascot.create({ canvas: document.getElementById("demo-avatar"), width: 48, height: 48, pixelRatio: 4 })
      avatarStage.add({ palette: "light", accessory: null }).pose({ x: 24, y: 25, R: 21, yaw: 0.35, pitch: 0.05, roll: -0.15, blink: 1 })
      avatarStage.render()

      // assets/demo-phone.mp4 is demo-video/public/tiktok/phone.mp4 cut into these parts:
      // [source from, source to, speed], after LEAD s of the first frame
      const LEAD = 0.5
      const PARTS = [[0, 3.4, 4.5], [4.2, 13.2, 5], [13.2, 16.4, 2.2], [16.4, 17.6, 3], [24.6, 27, 1.2]]
      function clipTime(src) {
        let t = LEAD
        for (const [a, b, speed] of PARTS) {
          if (src >= a && src <= b) return t + (src - a) / speed
          t += (b - a) / speed
        }
        return null // cut out
      }
      const partStart = (k) => clipTime(PARTS[k][0])
      const partEnd = (k) => clipTime(PARTS[k][1])

      // taps the agent made in the recording: source time, x, y in iPhone points (375x667)
      const TAPS = [[4.45, 187, 641], [6.15, 32, 634], [7.95, 32, 634], [8.75, 60, 265], [10.35, 277, 627], [11.85, 277, 627], [13.45, 100, 105], [16.25, 282, 625], [25.35, 61, 402]]
        .map(([s, x, y]) => [clipTime(s), x * (432 / 375), y * (768 / 667)])
      // chat steps follow the parts of the recording: appears, done
      const STEPS = [[0.55, partEnd(0)], [partStart(1), partEnd(1)], [partStart(2), partEnd(2)], [partStart(3), partEnd(3)], [partStart(4), partStart(4) + 0.45]]
      const FINAL = STEPS[4][1] + 0.1

      // camera: focus point (scene px) and zoom; eased between keys, always drifting a little
      const CAM = [
        [0, 1420, 350, 1.55], [0.8, 1330, 430, 1.32], [1.8, 975, 545, 1.0], [3.0, 940, 525, 1.04],
        [3.7, 500, 400, 1.42], [4.6, 540, 440, 1.36], [5.4, 1000, 545, 1.02], [6.4, 1240, 720, 1.28], [8.2, 1235, 745, 1.36],
      ]
      const ease = (k) => k * k * k * (k * (k * 6 - 15) + 10)
      function camera(t) {
        let i = 1
        while (i < CAM.length - 1 && t > CAM[i][0]) i++
        const [a, b] = [CAM[i - 1], CAM[i]]
        const k = ease(Math.max(0, Math.min(1, (t - a[0]) / (b[0] - a[0]))))
        const [cx, cy, s] = [1, 2, 3].map((j) => a[j] + (b[j] - a[j]) * k)
        return { cx: cx + Math.sin(t * 0.9) * 8, cy: cy + Math.cos(t * 0.7) * 6, s, rot: Math.sin(t * 0.6) * 0.5 }
      }

      const cam = document.getElementById("demo-cam")
      const ripple = document.getElementById("demo-ripple")
      const beam = document.getElementById("demo-beam-path")
      const pulse = document.getElementById("demo-pulse")
      const steps = [...document.querySelectorAll(".demo-step")]

      everyFrame(tl, DURATION, (t) => {
        const { cx, cy, s, rot } = camera(t)
        cam.style.transform = `translate(${960 - cx * s}px, ${540 - cy * s}px) scale(${s}) rotate(${rot}deg)`

        const tap = TAPS.find(([at]) => at != null && t >= at && t < at + 0.35)
        ripple.style.opacity = tap ? 1 - (t - tap[0]) / 0.35 : 0
        if (tap) ripple.style.transform = `translate(${tap[1]}px, ${tap[2]}px) scale(${0.5 + ((t - tap[0]) / 0.35) * 1.1})`

        // running step: spinner turns, beam points at it, a pulse runs to the phone when it starts
        const running = STEPS.findIndex(([a, b]) => t >= a && t < b)
        steps.forEach((el, k) => (el.querySelector(".spin").style.transform = `rotate(${t * 540}deg)`))
        if (running >= 0) {
          const y = 150 + 340 + running * 62 + 27
          beam.setAttribute("d", `M 820 ${y} C 770 ${y} 790 540 730 540`)
          const k = (t - STEPS[running][0]) / 0.4
          const len = beam.getTotalLength()
          const p = beam.getPointAtLength(len * Math.min(1, k))
          pulse.setAttribute("cx", p.x)
          pulse.setAttribute("cy", p.y)
          pulse.style.opacity = k < 1 ? 1 : 0
          beam.style.opacity = 1
        } else {
          pulse.style.opacity = 0
          beam.style.opacity = 0
        }
      })

      // the request, then one row per step: in with a slide, spinner, then a drawn check
      tl.fromTo("#demo-attach", { opacity: 0, y: 24, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, 0)
      tl.fromTo("#demo-ask", { opacity: 0, y: 24, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, 0.1)
      steps.forEach((el, k) => {
        const [a, b] = STEPS[k]
        const spin = el.querySelector(".spin")
        const done = el.querySelector(".done")
        const check = done.querySelector("path")
        tl.set(done, { opacity: 0 }, 0)
        tl.fromTo(el, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, a)
        tl.set(spin, { opacity: 0 }, b)
        tl.fromTo(done, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)", immediateRender: false }, b)
        tl.fromTo(check, { strokeDashoffset: 20 }, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, b + 0.05)
      })
      tl.fromTo("#demo-final", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, FINAL)

      // in: the chat slides in from the right, then the phone from the left; out: both lift away
      window.Kit.slideIn(tl, "#demo-chat", 0, { x: 700 })
      window.Kit.slideIn(tl, ["#demo-phone", "#demo-label"], 0.55, { x: -620 }, 0.8)
      window.Kit.slideOut(tl, ["#demo-chat", "#demo-phone", "#demo-label"], DURATION, { y: -240 })

      window.__timelines["demo"] = tl
    })()
  </script>
