  <script>
    (function () {
      const { FPS, keyframes, trackPose, everyFrame, stretchTo } = window.Kit
      const F0 = 476
      // the final line holds a bar longer
      const time = stretchTo(F0, 608.6, 10, [[562, 600, 1]])
      const tl = gsap.timeline({ paused: true })
      const stage = window.Mascot.create({ canvas: document.getElementById("outro-mascot"), width: 1280, height: 720 })
      const avatar = stage.add({ palette: "light" })

      // app icon: frame, center x, center y, size, opacity (source timing, moved left to make room for the wordmark)
      const ICON = [
        [476, 641, 360, 126, 1], [478, 641.5, 360, 145, 1], [480, 641, 359, 158, 1], [482, 640.5, 359.5, 165, 1],
        [484, 641, 360.5, 168, 1], [490, 641, 359, 169, 1], [492, 638.5, 359.5, 165, 1], [494, 609.5, 360, 151, 1],
        [496, 549.5, 360, 145, 1], [498, 475, 360, 142, 1], [500, 454, 360, 140, 1], [502, 444.5, 359.5, 140, 1],
        [504, 440, 359.5, 140, 1], [506, 437, 359.5, 140, 1], [510, 434, 359.5, 140, 1], [514, 430.5, 359.5, 140, 1],
        [518, 428, 360, 140, 1], [520, 428, 360.5, 139, 1], [522, 430, 360, 136, 1], [524, 436, 361, 130, 1],
        [526, 452, 362, 114, 1], [528, 474, 364.5, 91, 0.9], [529.5, 488, 366, 40, 0],
      ]
      // wordmark letters slide in from the right one after another: x offset in px per letter
      const LETTER_IN = (k) => 496 + k * 1.1
      const LETTER_DX = (k, frame) => {
        const age = Math.max(0, frame - LETTER_IN(k))
        return (70 + k * 6) * Math.pow(0.82, age)
      }
      const PX = 452 / 107 // px per wordmark unit
      // the big wordmark flies into its place in the line: frame, x, y, scale
      const BIG = [[524, 505, 300, 1], [531, 471, 345.6, 0.6]]
      const BIG_OUT = 531.5
      // line words: frame, x offsets of Connect, ghosthand, to, Grok, Bot from the final layout
      const WORDS = [
        [530, 120, 122, 117, -73, -77], [532, 113, 122, 117, -73, -77], [534, 105, 106, 117, -73, -77],
        [536, 101, 99, 102, -73, -77], [538, 96, 94, 93, -82, -77], [540, 90, 87, 85, -82, -81],
        [542, 74, 71, 69, -69, -69], [544, 40, 37, 35, -35, -37], [546, 24, 22, 20, -21, -23],
        [548, 16, 14, 12, -13, -15], [550, 10, 9, 7, -8, -10], [552, 7, 5, 4, -5, -6],
        [556, 2, 2, 1, -1, -2], [560, 0, 0, 0, 0, 0], [607, -12, -5, -2, 5, 9],
      ]
      const WORD_IN = [529, 531, 533, 535, 537]
      const AV_DX = 60 // the avatar sits between "to" and "Grok", further right than in the source
      // avatar before its eyes are tracked: frame, x, y, R, yaw
      const AV_IN = [
        [540.5, 724, 374.5, 0.1, 1.6], [541, 724, 374.5, 7.8, 1.6], [543, 727, 372, 30, 1.5], [545, 730, 369.7, 44, 1.4],
        [549, 734, 368.5, 48, 1.25], [553, 738, 368, 52.6, 1.05], [557, 741.4, 368.2, 53.8, 0.89],
      ]

      const icon = document.getElementById("outro-icon")
      const big = document.getElementById("outro-big")
      const letters = [...document.querySelectorAll(".outro-letter")]
      const words = ["#outro-connect", "#outro-wordmark", "#outro-to", "#outro-grok", "#outro-bot"].map((s) => document.querySelector(s))
      const glowA = document.getElementById("outro-glow-a")
      const glowB = document.getElementById("outro-glow-b")

      function draw(t) {
        const frame = time.frameAt(t)
        const [, cx, cy, size, op] = keyframes(ICON, frame)
        icon.style.transform = `translate(${cx - 640.5}px, ${cy - 360.5}px) scale(${size / 169})`
        icon.style.opacity = op

        letters.forEach((el, k) => {
          const fade = Math.min(1, Math.max(0, (frame - LETTER_IN(k)) / 3))
          el.style.opacity = frame < BIG_OUT ? fade : 0
          el.style.transform = `translateX(${LETTER_DX(k, frame) / PX}px)`
        })
        const k = Math.max(0, Math.min(1, (frame - BIG[0][0]) / (BIG[1][0] - BIG[0][0])))
        const e = 1 - Math.pow(1 - k, 2)
        const [x0, y0, s0] = BIG[0].slice(1)
        const [x1, y1, s1] = BIG[1].slice(1)
        big.style.transform = `translate(${(x1 - x0) * e}px, ${(y1 - y0) * e}px) scale(${s0 + (s1 - s0) * e})`

        const wo = keyframes(WORDS, frame)
        words.forEach((el, k) => {
          const fade = Math.min(1, Math.max(0, (frame - WORD_IN[k]) / 1.2))
          el.style.opacity = fade
          el.style.transform = `translate(${wo[k + 1]}px, ${(1 - fade) * 6}px)`
        })

        glowA.style.transform = `translate(${t * 14}px, ${-t * 10}px)`
        glowB.style.transform = `translate(${-t * 10}px, ${t * 8}px)`

        if (frame < 540.5) {
          avatar.pose({ hidden: true })
        } else if (frame < 557) {
          const [, x, y, R, yaw] = keyframes(AV_IN, frame)
          avatar.pose({ x: x + AV_DX, y, R, yaw, pitch: -0.06, roll: -0.2, accessory: true })
        } else {
          const s = trackPose("out", frame)
          avatar.pose({ ...s, x: s.x + AV_DX, accessory: true })
        }
        stage.render()
      }

      // the website fades in under the line
      tl.fromTo("#outro-url", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, time.lt(548))

      tl.fromTo(["#outro-glow-a", "#outro-glow-b", "#outro-dots"], { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0)

      everyFrame(tl, time.duration, draw)
      window.__timelines["outro"] = tl
    })()
  </script>
