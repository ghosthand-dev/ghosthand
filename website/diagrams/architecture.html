<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- source of website/public/assets/diagram-architecture.png and diagram-architecture-dark.png. Render from the repo root:
         bun ~/.config/opencode/skills/diagrams-and-charts/render.ts render website/diagrams/architecture.html -o website/public/assets/diagram-architecture.png, then again with -o website/public/assets/diagram-architecture-dark.png --dark nextjs-style -->
    <link rel="stylesheet" href="/skill/claude-style/style.css" />
  </head>
  <body>
    <div class="canvas" id="diagram">
      <div class="flow" style="--col-gap: 84px; --row-gap: 30px; justify-content: space-between">
        <div class="box group green" id="agents" style="grid-area: 1 / 1 / 4">
          <div>Agents</div>
          <div class="stack" style="gap: 120px">
            <div class="box" id="agent">Coding agent</div>
            <div class="box" id="mcpclient">MCP client</div>
          </div>
        </div>

        <div class="box blue node" id="cli" style="grid-area: 1 / 2">
          <div class="mono">ghosthand CLI</div>
          <div class="sub">Shell</div>
        </div>
        <div class="box purple node" id="hub" style="grid-area: 3 / 2">
          <div class="mono">ghosthand.dev</div>
          <div class="sub">MCP hub</div>
        </div>

        <div class="box blue node" id="controller" style="grid-area: 1 / 3 / 5; align-self: stretch">
          <div class="mono">Controller</div>
          <div class="sub">Daemon<br />Leases, OCR,<br />state.db</div>
        </div>

        <div class="box blue node" id="bt" style="grid-area: 1 / 4">
          <div>Bluetooth driver</div>
          <div class="sub">Mouse, keyboard</div>
        </div>
        <div class="box blue node dashed" id="xctest" style="grid-area: 2 / 4"><svg class="dash"><rect/></svg>
          <div>XCTest driver</div>
          <div class="sub">WebDriverAgent</div>
        </div>
        <div class="box blue node" id="capture" style="grid-area: 3 / 4">
          <div>USB capture</div>
          <div class="sub">Screen frames</div>
        </div>
        <div class="box blue node" id="lockdown" style="grid-area: 4 / 4">
          <div>USB lockdown</div>
          <div class="sub">Files, photos, apps</div>
        </div>

        <div class="box pink node" id="iphone" style="grid-area: 1 / 5 / 5; align-self: stretch">
          <div>iPhone</div>
          
        </div>
      </div>
